{{- $secret := .Values.existingSecret | default (printf "%s-env" (include "stratum-work-router.fullname" .)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stratum-work-router.fullname" . }}
  labels:
    {{- include "stratum-work-router.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stratum-work-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.configSecret }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stratum-work-router.selectorLabels" . | nindent 8 }}
        # Fixed label (independent of nameOverride) matched by the collector's
        # work-port NetworkPolicy.
        stratum.work/component: router
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CONFIG_PATH
              value: /etc/router/config.yaml
            - name: WORK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: WORK_TOKEN
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AMQP_URL
                  optional: true
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - name: stratum
              containerPort: {{ include "stratum-work-router.stratumPort" . }}
              protocol: TCP
            - name: admin
              containerPort: {{ include "stratum-work-router.adminPort" . }}
              protocol: TCP
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/router
              readOnly: true
      volumes:
        - name: config
          {{- if .Values.configSecret }}
          secret:
            secretName: {{ .Values.configSecret }}
            items:
              - key: config.yaml
                path: config.yaml
          {{- else }}
          configMap:
            name: {{ include "stratum-work-router.fullname" . }}
            items:
              - key: config.yaml
                path: config.yaml
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
