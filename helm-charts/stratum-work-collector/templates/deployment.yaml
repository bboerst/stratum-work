{{- if not .Values.pools -}}
{{- if and .Values.workMode.enabled (not .Values.existingSecret) -}}
{{- fail "workMode.enabled requires existingSecret (keys STRATUM_USERPASS, WORK_TOKEN)" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}-{{ .Values.poolName | lower | replace " " "-" | replace "." "-" | replace "+" "-" }}
  labels:
    app: {{ .Chart.Name }}-{{ .Values.poolName | lower | replace " " "-" | replace "." "-" | replace "+" "-" }}
spec:
  serviceName: {{ .Chart.Name }}-{{ .Values.poolName | lower | replace " " "-" | replace "." "-" | replace "+" "-" }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-{{ .Values.poolName | lower | replace " " "-" | replace "." "-" | replace "+" "-" }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-{{ .Values.poolName | lower | replace " " "-" | replace "." "-" | replace "+" "-" }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - "/usr/local/bin/python"
        - "main.py"
        args:
        {{- range .Values.arguments }}
        - {{ . | quote }}
        {{- end }}
        {{- if .Values.workMode.enabled }}
        - "--stratum-client-port"
        - {{ .Values.workMode.port | quote }}
        {{- end }}
        {{- $plain := dict }}
        {{- with .Values.site }}{{ $_ := set $plain "SITE" . }}{{ end }}
        {{- with .Values.mode }}{{ $_ := set $plain "MODE" . }}{{ end }}
        {{- if .Values.workMode.enabled }}{{ $_ := set $plain "MODE" "work" }}{{ end }}
        {{- with .Values.connectionId }}{{ $_ := set $plain "CONNECTION_ID" . }}{{ end }}
        {{- with .Values.account }}{{ $_ := set $plain "ACCOUNT" . }}{{ end }}
        {{- range $key, $val := .Values.env }}{{ $_ := set $plain $key $val }}{{ end }}
        {{- if or $plain .Values.existingSecret }}
        env:
        {{- range $key, $val := $plain }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        {{- if .Values.existingSecret }}
        {{- range list "STRATUM_USERPASS" "RABBITMQ_PASSWORD" "BITCOIN_RPC_PASSWORD" "WORK_TOKEN" }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.existingSecret }}
              key: {{ . }}
              {{- if not (and $.Values.workMode.enabled (has . (list "STRATUM_USERPASS" "WORK_TOKEN"))) }}
              optional: true
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if or .Values.service.enabled .Values.workMode.enabled }}
        ports:
          - name: "stratum"
            containerPort: {{ if .Values.workMode.enabled }}{{ .Values.workMode.port }}{{ else }}{{ .Values.service.ports.stratum }}{{ end }}
            protocol: TCP
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
{{- end }}
