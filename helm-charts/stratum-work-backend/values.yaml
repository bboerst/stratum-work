image:
  repository: bboerst/stratum-work-backend
  # tag:
  pullPolicy: IfNotPresent

replicaCount: 1

# Command line arguments
args: []
  # - --update-pools
  # - --reindex-blocks

# Environment variables
env:
  # Bitcoin RPC connection
  BITCOIN_RPC_USER: "user"
  BITCOIN_RPC_PASSWORD: "password"
  BITCOIN_RPC_HOST: "bitcoin-node"
  BITCOIN_RPC_PORT: "8332"
  
  # ZMQ configuration
  BITCOIN_ZMQ_BLOCK: "tcp://bitcoin-node:28332"
  MIN_BLOCK_HEIGHT: "882000"
  
  # MongoDB connection
  MONGODB_URL: "mongodb://mongodb:27017"
  MONGODB_DB: "stratum-logger"
  MONGODB_USERNAME: "mongouser"
  MONGODB_PASSWORD: "mongopassword"
  
  # RabbitMQ connection
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "mquser"
  RABBITMQ_PASSWORD: "mqpassword"
  RABBITMQ_EXCHANGE: "blocks"
  
  # Pool definitions
  POOL_LIST_URL: "https://raw.githubusercontent.com/mempool/mining-pools/refs/heads/master/pools-v2.json"
  POOL_UPDATE_INTERVAL: "86400"
  LOCAL_POOL_FILE: "pool_definitions.json"

  # Optional settings (defaults shown, so leaving them out keeps today's behavior):
  # BITCOIN_RPC_SCHEME: "http"         # or https
  # BITCOIN_RPC_CA_FILE: ""            # CA bundle for https RPC with a private CA (mount it with extraVolumes)
  # BITCOIN_RPC_TIMEOUT: "30"          # seconds
  # ENABLE_HISTORICAL_DATA: "true"
  #
  # Storage backend (#112): mongodb (default) or postgres. With postgres, the MONGODB_* settings are unused.
  # DB_BACKEND: "mongodb"
  # PG_HOST: "postgres"
  # PG_PORT: "5432"
  # PG_DATABASE: "stratum"
  # PG_USER: "backend"                 # a member of the stratum_backend role
  # PG_SSLMODE: "verify-full"          # libpq sslmode; production uses verify-full with the cluster CA
  # PG_SSLROOTCERT: "/etc/postgres-ca/ca.crt"
  # PG_PASSWORD: take it from a Secret with envValueFrom instead of putting it here

# Environment variables read from Secrets or ConfigMaps (any `valueFrom` source), e.g. a CloudNativePG app secret:
#   envValueFrom:
#     PG_PASSWORD:
#       secretKeyRef: { name: stratum-pg-backend, key: password }
# A name may not appear in both env and envValueFrom.
envValueFrom: {}

# Extra volumes and mounts, e.g. a CA certificate for PG_SSLROOTCERT / BITCOIN_RPC_CA_FILE:
#   extraVolumes:
#     - name: postgres-ca
#       secret: { secretName: stratum-pg-ca, items: [{ key: ca.crt, path: ca.crt }] }
#   extraVolumeMounts:
#     - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: true
  type: ClusterIP
  port: 8001
  
  ## Deprecated, instead simply do not provide a clusterIP value
  omitClusterIP: false
  # clusterIP: ""

  ## List of IP addresses at which the controller services are available
  ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
  ##
  externalIPs: []

  loadBalancerIP: ""
  loadBalancerSourceRanges: []

  ## Set external traffic policy to: "Local" to preserve source IP on
  ## providers supporting it
  ## Ref: https://kubernetes.io/docs/tutorials/services/source-ip/#source-ip-for-services-with-typeloadbalancer
  externalTrafficPolicy: ""

  # Must be either "None" or "ClientIP" if set. Kubernetes will default to "None".
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
  sessionAffinity: ""

  healthCheckNodePort: 0

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Pod Security Context
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

# Container Security Context
containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {} 