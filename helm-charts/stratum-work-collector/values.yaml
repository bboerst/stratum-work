# Which collector to run: "python" (collector/, the default) or "go" (collector-go/, stratum-work#148). Both take
# the same arguments. The Go collector does not write MongoDB (its --db-* flags are ignored) and reads passwords only
# from the environment (RABBITMQ_PASSWORD, PG_PASSWORD, BITCOIN_RPC_PASSWORD; see `env` / `envFrom`).
implementation: python

image:
  repository: bboerst/stratum-work-collector
  # tag:
  pullPolicy: IfNotPresent

# Image for implementation: go (pin a sha-<7> tag).
goImage:
  repository: bboerst/stratum-work-collector-go
  # tag:

# Extra container environment, e.g. passwords from a Secret:
#   env:
#     - name: RABBITMQ_PASSWORD
#       valueFrom: {secretKeyRef: {name: collector-secrets, key: rabbitmq-password}}
env: []
envFrom: []

# Go only: replica identity when a pool is collected more than once per site (stored in sources.replica).
replica: ""

# Go only: /livez, /readyz and /metrics on this port, with liveness/readiness probes.
health:
  port: 8080
  # /readyz fails when the last mining.notify is older than this (minutes); raise it for quiet pools.
  readyMaxNotifyAgeMinutes: 10
  livenessProbe:
    httpGet: {path: /livez, port: health}
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet: {path: /readyz, port: health}
    periodSeconds: 15
    failureThreshold: 2

podAnnotations: {}

poolName: "Best Stratum Pool"

arguments:
  - --url
  - "stratum+tcp://beststratumpool.com:3333"
  - --userpass
  - "username:password"
  - --db-url
  - "mongodb://localhost:27017"
  - --db-name
  - "stratum_db"
  - --db-username
  - "admin"
  - --db-password
  - "password"
  - --log-level
  - "INFO"

service:
  enabled: false
  ## Deprecated, instead simply do not provide a clusterIP value
  omitClusterIP: false
  # clusterIP: ""

  ## List of IP addresses at which the controller services are available
  ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
  ##
  externalIPs: []

  loadBalancerIP: ""
  loadBalancerSourceRanges: []

  ## Set external traffic policy to: "Local" to preserve source IP on
  ## providers supporting it
  ## Ref: https://kubernetes.io/docs/tutorials/services/source-ip/#source-ip-for-services-with-typeloadbalancer
  externalTrafficPolicy: ""

  # Must be either "None" or "ClientIP" if set. Kubernetes will default to "None".
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
  sessionAffinity: ""

  healthCheckNodePort: 0

  ports:
    stratum: 3333

  type: ClusterIP

resources:
  requests:
    memory: 40Mi