# Local development stack.
# Machine-specific settings (Bitcoin node, browser origin, ...) come from ./.env (see .env.example).
# For machine-specific compose changes (e.g. port bindings), use a docker-compose.override.yml.
# Both files are gitignored.

# Template for collector services
x-collector-base: &collector-base
  build: ./collector
  restart: unless-stopped
  deploy:
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 120s
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_started
  environment:
    ENABLE_HISTORICAL_DATA: ${ENABLE_HISTORICAL_DATA:-true}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: mquser
    RABBITMQ_PASSWORD: mqpassword
    RABBITMQ_EXCHANGE: mining_notify_exchange
    MONGODB_USERNAME: mongouser
    MONGODB_PASSWORD: mongopassword
    MONGODB_HOSTS: mongodb
    SOCKET_URL: http://localhost:8000
    # Bitcoin node for BTC/BCH chain detection (same node as the backend; see .env)
    BITCOIN_RPC_SCHEME: ${BITCOIN_RPC_SCHEME:-http}
    BITCOIN_RPC_CA_FILE: ${BITCOIN_RPC_CA_FILE:+/certs/bitcoin-rpc-ca.pem}
    BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST:-host.docker.internal}
    BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
    BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-rpc_user}
    BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-rpc_password}
    BITCOIN_ZMQ_BLOCK: ${BITCOIN_ZMQ_BLOCK:-tcp://host.docker.internal:28332}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ${BITCOIN_RPC_CA_FILE:-/dev/null}:/certs/bitcoin-rpc-ca.pem:ro

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mquser
      RABBITMQ_DEFAULT_PASS: mqpassword
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:7.0.24 # matches production
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongouser
      - MONGO_INITDB_ROOT_PASSWORD=mongopassword
      - MONGO_INITDB_DATABASE=stratum-logger

  collector-antpool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command: >
      /usr/local/bin/python main.py
      --pool-name "Antpool"
      --url "stratum+tcp://ss.antpool.com:443"
      --userpass "developer.001"
      --rabbitmq-host "rabbitmq"
      --rabbitmq-username "mquser"
      --rabbitmq-password "mqpassword"
      --db-url "mongodb"
      --db-name "stratum-logger"
      --db-username "mongouser"
      --db-password "mongopassword"
      --log-level "DEBUG"

  collector-f2pool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command: >
      /usr/local/bin/python main.py
      --pool-name "F2Pool"
      --url "stratum+tcp://btc-eu.f2pool.com:3333"
      --userpass "developer1.001:1234567890"
      --rabbitmq-host "rabbitmq"
      --rabbitmq-username "mquser"
      --rabbitmq-password "mqpassword"
      --db-url "mongodb"
      --db-name "stratum-logger"
      --db-username "mongouser"
      --db-password "mongopassword"
      --log-level "DEBUG"

  collector-poolin:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command: >
      /usr/local/bin/python main.py
      --pool-name "Poolin"
      --url "stratum+tcp://btc.ss.poolin.me:443"
      --userpass "developer1.001:123"
      --rabbitmq-host "rabbitmq"
      --rabbitmq-username "mquser"
      --rabbitmq-password "mqpassword"
      --db-url "mongodb"
      --db-name "stratum-logger"
      --db-username "mongouser"
      --db-password "mongopassword"
      --log-level "DEBUG"

  collector-secpool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command: >
      /usr/local/bin/python main.py
      --pool-name "SecPool"
      --url "stratum+tcp://btc.secpool.com:3333"
      --userpass "developer1.001:x"
      --rabbitmq-host "rabbitmq"
      --rabbitmq-username "mquser"
      --rabbitmq-password "mqpassword"
      --db-url "mongodb"
      --db-name "stratum-logger"
      --db-username "mongouser"
      --db-password "mongopassword"
      --log-level "DEBUG"

  collector-256foundation:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command: >
      /usr/local/bin/python main.py
      --pool-name "256Foundation"
      --url "stratum+tcp://pool.256foundation.org:3333"
      --userpass "developer1.001:x"
      --rabbitmq-host "rabbitmq"
      --rabbitmq-username "mquser"
      --rabbitmq-password "mqpassword"
      --db-url "mongodb"
      --db-name "stratum-logger"
      --db-username "mongouser"
      --db-password "mongopassword"
      --log-level "DEBUG"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    environment:
      ENABLE_HISTORICAL_DATA: ${ENABLE_HISTORICAL_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: mquser
      RABBITMQ_PASSWORD: mqpassword
      RABBITMQ_EXCHANGE: mining_notify_exchange
      MONGODB_USERNAME: mongouser
      MONGODB_PASSWORD: mongopassword
      MONGODB_HOSTS: mongodb
      DATABASE_URL: "mongodb://mongouser:mongopassword@mongodb:27017/stratum-logger?authSource=admin"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      backend:
        condition: service_started

  backend:
    build: ./backend
    # command: >
    #   python main.py
    #   --reindex-blocks
    # Comment out the host network mode to use the default bridge network
    # network_mode: host
    environment:
      ENABLE_HISTORICAL_DATA: ${ENABLE_HISTORICAL_DATA:-true}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-rpc_user}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-rpc_password}
      BITCOIN_RPC_SCHEME: ${BITCOIN_RPC_SCHEME:-http}
      BITCOIN_RPC_CA_FILE: ${BITCOIN_RPC_CA_FILE:+/certs/bitcoin-rpc-ca.pem}
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST:-host.docker.internal}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      BITCOIN_ZMQ_BLOCK: ${BITCOIN_ZMQ_BLOCK:-tcp://host.docker.internal:28332}
      MONGODB_URL: "mongodb://mongodb:27017"
      MONGODB_DB: "stratum-logger"
      MONGODB_USERNAME: "mongouser"
      MONGODB_PASSWORD: "mongopassword"
      MIN_BLOCK_HEIGHT: ${MIN_BLOCK_HEIGHT:-863998} # set near the tip in .env to keep the initial sync short
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: "mquser"
      RABBITMQ_PASSWORD: "mqpassword"
      RABBITMQ_EXCHANGE: blocks
      PORT: ${BACKEND_PORT:-8001}
    extra_hosts:
      - "host.docker.internal:host-gateway" # node on the Docker host (Linux needs this mapping)
    volumes:
      # CA bundle for an https RPC endpoint (BITCOIN_RPC_CA_FILE in .env). /dev/null when unused.
      - ${BITCOIN_RPC_CA_FILE:-/dev/null}:/certs/bitcoin-rpc-ca.pem:ro
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    expose:
      - "${BACKEND_PORT:-8001}"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # ── Postgres + TimescaleDB (opt-in: docker compose --profile postgres up) ─────────────────────
  # Migration target for #90 (design: docs/design/postgres-timescale.md). MongoDB stays the default until cutover.
  postgres:
    image: timescale/timescaledb:2.30.2-pg18
    profiles: ["postgres"]
    command: ["postgres", "-c", "timescaledb.enable_chunk_skipping=on"]
    environment:
      POSTGRES_USER: stratum
      POSTGRES_PASSWORD: stratum
      POSTGRES_DB: stratum
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql   # Postgres 18 images: mount the parent dir (data lives in a versioned subdir)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stratum", "-d", "stratum"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies db/migrations, then exits.
  postgres-migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    profiles: ["postgres"]
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgres://stratum:stratum@postgres:5432/stratum?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Creates the local per-service login users (collector/backend/web), then exits.
  postgres-dev-users:
    image: timescale/timescaledb:2.30.2-pg18
    profiles: ["postgres"]
    entrypoint: ["psql", "postgres://stratum:stratum@postgres:5432/stratum", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db/dev-users.sql"]
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mongo-data:
  pg-data:
