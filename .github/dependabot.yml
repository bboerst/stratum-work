# Dependency update PRs (#118). Grouped, so each ecosystem and directory opens one PR per week instead of one per
# package. A 7-day cooldown skips versions published less than a week ago (supply-chain safety); security updates
# ignore the cooldown. Base images are pinned as `<version>@sha256:<digest>`, and Dependabot updates both parts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Other majors get their own PRs and a separate review.
    ignore:
      # Prisma 7 doesn't support MongoDB ("please stay on Prisma v6"). The web moves to Postgres via `pg` (#113),
      # so Prisma goes away with MongoDB rather than being upgraded.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      # TypeScript 7 (the Go compiler): typescript-eslint doesn't support it yet, so `npm run lint` fails.
      # Remove once typescript-eslint/typescript-eslint#10940 ships.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node tracks the Node runtime major (node:24 in web/Dockerfile); move both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directories: [/collector, /backend]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/web, /collector, /backend, /postgres]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Stay on the current major lines; moving Node 24 → 26 or Python 3.13 → 3.14 is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: ghcr.io/cloudnative-pg/postgresql
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
