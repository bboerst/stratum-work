image:
  repository: bboerst/stratum-work-backend
  # tag:
  pullPolicy: IfNotPresent

replicaCount: 1

# Command line arguments
args: []
  # - --update-pools
  # - --reindex-blocks

# Name of a Secret whose keys are exposed as environment variables.
# Expected keys: DATABASE_URL, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, BITCOIN_RPC_PASSWORD
existingSecret: ""

# Non-secret environment variables
env:
  # Bitcoin RPC connection
  BITCOIN_RPC_USER: "user"
  BITCOIN_RPC_HOST: "bitcoin-node"
  BITCOIN_RPC_PORT: "8332"
  
  # ZMQ configuration
  # backend subscribes to `hashblock` (zmqpubhashblock), not rawblock
  BITCOIN_ZMQ_BLOCK: "tcp://bitcoin-node:28333"
  MIN_BLOCK_HEIGHT: "882000"
  
  # Postgres writes (DATABASE_URL comes from existingSecret)
  ENABLE_HISTORICAL_DATA: "true"
  
  # RabbitMQ connection
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_EXCHANGE: "blocks"
  
  # Pool definitions
  POOL_LIST_URL: "https://raw.githubusercontent.com/mempool/mining-pools/refs/heads/master/pools-v2.json"
  POOL_UPDATE_INTERVAL: "86400"
  LOCAL_POOL_FILE: "pool_definitions.json"

service:
  enabled: true
  type: ClusterIP
  port: 8001
  
  ## Deprecated, instead simply do not provide a clusterIP value
  omitClusterIP: false
  # clusterIP: ""

  ## List of IP addresses at which the controller services are available
  ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
  ##
  externalIPs: []

  loadBalancerIP: ""
  loadBalancerSourceRanges: []

  ## Set external traffic policy to: "Local" to preserve source IP on
  ## providers supporting it
  ## Ref: https://kubernetes.io/docs/tutorials/services/source-ip/#source-ip-for-services-with-typeloadbalancer
  externalTrafficPolicy: ""

  # Must be either "None" or "ClientIP" if set. Kubernetes will default to "None".
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
  sessionAffinity: ""

  healthCheckNodePort: 0

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

priorityClassName: ""

# Pod Security Context
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

# Container Security Context
containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {} 