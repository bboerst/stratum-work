name: Build DATUM Gateway Multiarch Docker Image

on:
  release:
    types: [published]

env:
  DOCKER_IMAGE: bboerst/stratum-work-datum
  # Upstream OCEAN-xyz/datum_gateway tag; keep in sync with images/datum/Dockerfile
  # and the stratum-work-datum chart appVersion.
  DATUM_VERSION: v0.4.1beta

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: ./images/datum
        push: true
        build-args: |
          DATUM_VERSION=${{ env.DATUM_VERSION }}
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ env.DATUM_VERSION }}
          ${{ env.DOCKER_IMAGE }}:${{ github.event.release.tag_name }}
        platforms: |
          linux/amd64
          linux/arm64

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
