# Database tests:
#   migrations     db/migrations up -> down -> up + role privileges, on the official TimescaleDB image (local dev) and
#                  on the CloudNativePG + TimescaleDB image built from postgres/Dockerfile (production)
#   collector-sink collector-go's Postgres sink against a real migrated database, connected as the least-privilege
#                  collector role
#   backend-store  backend/integrations/store.py (PostgresStore) against a real migrated database, as the backend role
#   stale-blocks   backend stale-block tracking end to end: two regtest nodes, a fork and a reorg (throwaway containers),
#                  then best-chain reconciliation across reorgs, then the historical gap
#                  fill on a pruned node (getblockfrompeer)
name: db

on:
  pull_request:
    paths: ["db/**", "postgres/**", "collector-go/**", "backend/integrations/store.py", "backend/requirements.txt", "backend/tests/**", "backend/stale_blocks.py", "backend/stale_import.py", "backend/reconcile.py", "backend/best_chain_history.py", "backend/gap_fill.py", "backend/main.py", "backend/test-stale-blocks-e2e.sh", "backend/test-reorg-reconcile-e2e.sh", "backend/test-block-gap-fill-e2e.sh", ".github/workflows/db.yml", "backend/unknown_parents.py", "backend/reported_hashrate.py"]
  push:
    branches: [main]
    paths: ["db/**", "postgres/**", "collector-go/**", "backend/integrations/store.py", "backend/requirements.txt", "backend/tests/**", "backend/stale_blocks.py", "backend/stale_import.py", "backend/reconcile.py", "backend/best_chain_history.py", "backend/gap_fill.py", "backend/main.py", "backend/test-stale-blocks-e2e.sh", "backend/test-reorg-reconcile-e2e.sh", "backend/test-block-gap-fill-e2e.sh", ".github/workflows/db.yml", "backend/unknown_parents.py", "backend/reported_hashrate.py"]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Migrations on timescale/timescaledb (local dev image)
        run: db/test-migrations.sh

      - name: Build the CNPG + TimescaleDB image
        run: docker build -t stratum-work-postgres:ci postgres/

      - name: Migrations on the CNPG image
        run: db/test-migrations.sh --image stratum-work-postgres:ci

  collector-sink:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start TimescaleDB, migrate, create local users
        run: |
          docker network create t
          docker run -d --name pg --network t -p 5432:5432 -e POSTGRES_USER=stratum -e POSTGRES_PASSWORD=stratum -e POSTGRES_DB=stratum \
            timescale/timescaledb:2.30.2-pg18 -c timescaledb.enable_chunk_skipping=on
          for _ in $(seq 60); do docker exec pg pg_isready -U stratum -d stratum && break; sleep 1; done
          docker run --rm --network t -v "$PWD/db:/db:ro" -e DATABASE_URL="postgres://stratum:stratum@pg:5432/stratum?sslmode=disable" \
            -e DBMATE_NO_DUMP_SCHEMA=true ghcr.io/amacneil/dbmate:2.37.0 --wait up
          docker exec -i pg psql -U stratum -d stratum -v ON_ERROR_STOP=1 -q < db/dev-users.sql

      # In the pinned image tests.yml uses, on the database's network; -run limits it to the integration test (the
      # rest runs in tests.yml).
      - name: Collector sink integration test (as the collector role)
        run: |
          docker run --rm --network t -v "$PWD/collector-go:/src" -w /src \
            -e PG_TEST_HOST=pg -e PG_TEST_USER=collector -e PG_TEST_PASSWORD=collector \
            -e PG_TEST_ADMIN_USER=stratum -e PG_TEST_ADMIN_PASSWORD=stratum \
            golang:1.27.2@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8 \
            go test -race -count=1 -run '^TestPostgresIntegration$' -v ./...

  backend-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start TimescaleDB, migrate, create local users
        run: |
          docker network create t
          docker run -d --name pg --network t -p 5432:5432 -e POSTGRES_USER=stratum -e POSTGRES_PASSWORD=stratum -e POSTGRES_DB=stratum \
            timescale/timescaledb:2.30.2-pg18 -c timescaledb.enable_chunk_skipping=on
          for _ in $(seq 60); do docker exec pg pg_isready -U stratum -d stratum && break; sleep 1; done
          docker run --rm --network t -v "$PWD/db:/db:ro" -e DATABASE_URL="postgres://stratum:stratum@pg:5432/stratum?sslmode=disable" \
            -e DBMATE_NO_DUMP_SCHEMA=true ghcr.io/amacneil/dbmate:2.37.0 --wait up
          docker exec -i pg psql -U stratum -d stratum -v ON_ERROR_STOP=1 -q < db/dev-users.sql

      - name: Backend store tests + Postgres integration (as the backend role)
        env:
          PG_TEST_HOST: localhost
          PG_TEST_USER: backend
          PG_TEST_PASSWORD: backend
          PG_TEST_ADMIN_DSN: postgresql://stratum:stratum@localhost/stratum
        run: |
          python3 -m pip install -q -r backend/requirements.txt pytest
          cd backend && python3 -m pytest -v tests

  stale-blocks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stale blocks end to end (regtest fork + reorg)
        run: backend/test-stale-blocks-e2e.sh

      - name: Best-chain reconciliation end to end (reorgs with the tracker off, backend down, 2 deep, full-history check)
        run: backend/test-reorg-reconcile-e2e.sh

      - name: Historical gap fill end to end (pruned regtest node, gaps fetched via getblockfrompeer)
        run: backend/test-block-gap-fill-e2e.sh
