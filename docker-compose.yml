# Local development stack.
# Machine-specific settings (Bitcoin node, browser origin, ...) come from ./.env (see .env.example).
# For machine-specific compose changes (e.g. port bindings), use a docker-compose.override.yml.
# Both files are gitignored.

# Template for collector services (collector-go: flags in collector-go/main.go, `--help` lists them)
x-collector-base: &collector-base
  build: ./collector-go
  restart: unless-stopped
  deploy:
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 120s
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres-dev-users:
      condition: service_completed_successfully
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: mquser
    RABBITMQ_PASSWORD: mqpassword   # env only: the collector refuses passwords on the command line
    RABBITMQ_EXCHANGE: mining_notify_exchange
    # Postgres: every template goes to `templates`, as the local `collector` user (see .env.example to override)
    PG_HOST: ${COLLECTOR_PG_HOST:-postgres}
    PG_PORT: ${COLLECTOR_PG_PORT:-5432}
    PG_DATABASE: ${COLLECTOR_PG_DATABASE:-stratum}
    PG_USER: ${COLLECTOR_PG_USER:-collector}
    PG_PASSWORD: ${COLLECTOR_PG_PASSWORD:-collector}
    PG_SSLMODE: ${COLLECTOR_PG_SSLMODE:-prefer}
    COLLECTOR_SITE: ${COLLECTOR_SITE:-local}
    COLLECTOR_REPLICA: ${COLLECTOR_REPLICA:-a}

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mquser
      RABBITMQ_DEFAULT_PASS: mqpassword
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  collector-antpool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command:
      - --pool-name=Antpool
      - --url=stratum+tcp://ss.antpool.com:443
      - --userpass=developer.001
      - --log-level=DEBUG

  collector-f2pool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command:
      - --pool-name=F2Pool
      - --url=stratum+tcp://btc-eu.f2pool.com:3333
      - --userpass=developer1.001:1234567890
      - --log-level=DEBUG

  collector-poolin:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command:
      - --pool-name=Poolin
      - --url=stratum+tcp://btc.ss.poolin.me:443
      - --userpass=developer1.001:123
      - --log-level=DEBUG

  collector-secpool:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command:
      - --pool-name=SecPool
      - --url=stratum+tcp://btc.secpool.com:3333
      - --userpass=developer1.001:x
      - --log-level=DEBUG

  collector-256foundation:
    <<: *collector-base
    # Expose unique port for each collector if --enable-stratum-client
    # ports:
    #   - "3333:3333"
    command:
      - --pool-name=256Foundation
      - --url=stratum+tcp://pool.256foundation.org:3333
      - --userpass=developer1.001:x
      - --log-level=DEBUG

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    environment:
      ENABLE_HISTORICAL_DATA: ${ENABLE_HISTORICAL_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: mquser
      RABBITMQ_PASSWORD: mqpassword
      RABBITMQ_EXCHANGE: mining_notify_exchange
      # Reads (#113), as the local read-only `web` user
      PG_HOST: ${WEB_PG_HOST:-postgres}
      PG_PORT: ${WEB_PG_PORT:-5432}
      PG_DATABASE: ${WEB_PG_DATABASE:-stratum}
      PG_USER: ${WEB_PG_USER:-web}
      PG_PASSWORD: ${WEB_PG_PASSWORD:-web}
      PG_SSLMODE: ${WEB_PG_SSLMODE:-disable}
      # Live display limit per pool (#105); 0 disables.
      STREAM_POOL_RATE: ${STREAM_POOL_RATE:-5}
      STREAM_POOL_BURST: ${STREAM_POOL_BURST:-20}
      # Key for masking extranonce1 in served data (#105); optional, empty = random per start.
      EXTRANONCE1_MASK_KEY: ${EXTRANONCE1_MASK_KEY:-}
      # Fee rates for the table (#198). This stack runs no mempool recorder, so the browser asks mempool.space;
      # auto = this deployment's /api/tx.
      TX_API_SOURCE: ${TX_API_SOURCE:-mempool.space}
      TX_API_MEMPOOL_SPACE_FALLBACK: ${TX_API_MEMPOOL_SPACE_FALLBACK:-false}
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-dev-users:
        condition: service_completed_successfully
      backend:
        condition: service_started

  backend:
    build: ./backend
    # command: >
    #   python main.py
    #   --reindex-blocks
    # Comment out the host network mode to use the default bridge network
    # network_mode: host
    environment:
      ENABLE_HISTORICAL_DATA: ${ENABLE_HISTORICAL_DATA:-true}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-rpc_user}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-rpc_password}
      BITCOIN_RPC_SCHEME: ${BITCOIN_RPC_SCHEME:-http}
      BITCOIN_RPC_CA_FILE: ${BITCOIN_RPC_CA_FILE:+/certs/bitcoin-rpc-ca.pem}
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST:-host.docker.internal}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      BITCOIN_ZMQ_BLOCK: ${BITCOIN_ZMQ_BLOCK:-tcp://host.docker.internal:28332}
      MIN_BLOCK_HEIGHT: ${MIN_BLOCK_HEIGHT:-863998} # set near the tip in .env to keep the initial sync short
      BLOCK_GAP_WINDOW: ${BLOCK_GAP_WINDOW:-144}
      BLOCK_GAP_FILL_INTERVAL_S: ${BLOCK_GAP_FILL_INTERVAL_S:-3600}
      BLOCK_GAP_FILL_MAX_BLOCKS: ${BLOCK_GAP_FILL_MAX_BLOCKS:-50}
      BLOCK_GAP_FILL_PEERS: ${BLOCK_GAP_FILL_PEERS:-3}
      BLOCK_GAP_FILL_PEER_TIMEOUT_S: ${BLOCK_GAP_FILL_PEER_TIMEOUT_S:-30}
      BEST_CHAIN_HISTORY_INTERVAL_S: ${BEST_CHAIN_HISTORY_INTERVAL_S:-86400}
      # `docker compose run --rm backend python -m reported_hashrate` (off unless the URL is set)
      REPORTED_HASHRATE_URL: ${REPORTED_HASHRATE_URL:-}
      REPORTED_HASHRATE_USER_AGENT: ${REPORTED_HASHRATE_USER_AGENT:-}
      REPORTED_HASHRATE_REFERER: ${REPORTED_HASHRATE_REFERER:-}
      REPORTED_HASHRATE_SOURCE: ${REPORTED_HASHRATE_SOURCE:-miningpoolstats}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: "mquser"
      RABBITMQ_PASSWORD: "mqpassword"
      RABBITMQ_EXCHANGE: blocks
      PORT: ${BACKEND_PORT:-8001}
      # Storage (#112), as the local `backend` user
      PG_HOST: ${BACKEND_PG_HOST:-postgres}
      PG_PORT: ${BACKEND_PG_PORT:-5432}
      PG_DATABASE: ${BACKEND_PG_DATABASE:-stratum}
      PG_USER: ${BACKEND_PG_USER:-backend}
      PG_PASSWORD: ${BACKEND_PG_PASSWORD:-backend}
    extra_hosts:
      - "host.docker.internal:host-gateway" # node on the Docker host (Linux needs this mapping)
    volumes:
      # CA bundle for an https RPC endpoint (BITCOIN_RPC_CA_FILE in .env). /dev/null when unused.
      - ${BITCOIN_RPC_CA_FILE:-/dev/null}:/certs/bitcoin-rpc-ca.pem:ro
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    expose:
      - "${BACKEND_PORT:-8001}"
    depends_on:
      postgres-dev-users:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ── Postgres + TimescaleDB (design: docs/design/postgres-timescale.md) ─────────────────────────
  postgres:
    image: timescale/timescaledb:2.30.2-pg18
    command: ["postgres", "-c", "timescaledb.enable_chunk_skipping=on"]
    environment:
      POSTGRES_USER: stratum
      POSTGRES_PASSWORD: stratum
      POSTGRES_DB: stratum
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql   # Postgres 18 images: mount the parent dir (data lives in a versioned subdir)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stratum", "-d", "stratum"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies db/migrations, then exits.
  postgres-migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgres://stratum:stratum@postgres:5432/stratum?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Creates the local per-service login users (collector/backend/web), then exits.
  postgres-dev-users:
    image: timescale/timescaledb:2.30.2-pg18
    entrypoint: ["psql", "postgres://stratum:stratum@postgres:5432/stratum", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/db/dev-users.sql"]
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pg-data:
