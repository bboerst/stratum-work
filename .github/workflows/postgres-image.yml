name: Build Postgres (CNPG + TimescaleDB) Image

on:
  push:
    # cluster-platform: pre-merge validation of the new clusters (workflow_dispatch only works
    # once this file exists on the default branch). Drop it after the branch is merged.
    branches: [main, cluster-platform]
    paths:
      - 'images/postgres/**'
      - '.github/workflows/postgres-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bboerst/stratum-work-postgres
  TAG: 17-ts2.30.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No linux/arm/v7: the CNPG base image and the TimescaleDB apt repo only ship amd64 and arm64.
    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: ./images/postgres
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ env.TAG }}
        platforms: |
          linux/amd64
          linux/arm64

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
