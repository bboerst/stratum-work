image:
  repository: bboerst/stratum-work-backend
  # tag:
  pullPolicy: IfNotPresent

replicaCount: 1

# Command line arguments
args: []
  # - --update-pools
  # - --reindex-blocks

# Environment variables
env:
  # Bitcoin RPC connection
  BITCOIN_RPC_USER: "user"
  BITCOIN_RPC_PASSWORD: "password"
  BITCOIN_RPC_HOST: "bitcoin-node"
  BITCOIN_RPC_PORT: "8332"
  
  # ZMQ configuration
  BITCOIN_ZMQ_BLOCK: "tcp://bitcoin-node:28332"
  MIN_BLOCK_HEIGHT: "882000"
  
  # RabbitMQ connection
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "mquser"
  RABBITMQ_PASSWORD: "mqpassword"
  RABBITMQ_EXCHANGE: "blocks"
  
  # Pool definitions
  POOL_LIST_URL: "https://raw.githubusercontent.com/mempool/mining-pools/refs/heads/master/pools-v2.json"
  POOL_UPDATE_INTERVAL: "86400"
  LOCAL_POOL_FILE: "pool_definitions.json"

  # Optional settings (defaults shown, so leaving them out keeps today's behavior):
  # BITCOIN_RPC_SCHEME: "http"         # or https
  # BITCOIN_RPC_CA_FILE: ""            # CA bundle for https RPC with a private CA (mount it with extraVolumes)
  # BITCOIN_RPC_TIMEOUT: "30"          # seconds
  # ENABLE_HISTORICAL_DATA: "true"
  #
  # Storage (#112): Postgres + TimescaleDB, as separate fields (never a URL).
  # PG_HOST: "postgres"
  # PG_PORT: "5432"
  # PG_DATABASE: "stratum"
  # PG_USER: "backend"                 # a member of the stratum_backend role
  # PG_SSLMODE: "verify-full"          # libpq sslmode; production uses verify-full with the cluster CA
  # PG_SSLROOTCERT: "/etc/postgres-ca/ca.crt"
  # PG_PASSWORD: take it from a Secret with envValueFrom instead of putting it here
  #
  # Stale blocks (#180): getchaintips on every new block and on this timer. The node's RPC user
  # needs getchaintips, getblockheader, getblock and getblockhash (getchaintips and getblockheader also with the
  # tracker off: the best-chain reconciler, #212, records the blocks it replaces the same way).
  # STALE_BLOCKS_ENABLED: "true"
  # STALE_POLL_INTERVAL_S: "60"
  #
  # Historical gap fill (gap_fill.py): missing blocks between MIN_BLOCK_HEIGHT and the stored tip, after the startup
  # sync and on this timer (0 = off). On a pruned node it also needs getpeerinfo and getblockfrompeer.
  # BLOCK_GAP_FILL_INTERVAL_S: "3600"
  # BLOCK_GAP_FILL_MAX_BLOCKS: "50"
  # BLOCK_GAP_FILL_PEERS: "3"
  # BLOCK_GAP_FILL_PEER_TIMEOUT_S: "30"
  #
  # Full-history best-chain check (best_chain_history.py): every stored best block between MIN_BLOCK_HEIGHT and the
  # stored tip against the node's chain, after the startup sync and on this timer (0 = off). Same RPC methods as above.
  # BEST_CHAIN_HISTORY_INTERVAL_S: "86400"
  #
  # Unknown-parents summary (unknown_parents.py): unknown_parent_pools, read by the web's /unknown-parents page, after
  # each new block (last 2 hours) and once after the startup sync (last 7 days); history via
  # `python -m unknown_parents --backfill`. "false" = off.
  # UNKNOWN_PARENTS_ENABLED: "true"

# Environment variables read from Secrets or ConfigMaps (any `valueFrom` source), e.g. a CloudNativePG app secret:
#   envValueFrom:
#     PG_PASSWORD:
#       secretKeyRef: { name: stratum-pg-backend, key: password }
# A name may not appear in both env and envValueFrom.
envValueFrom: {}

# Extra volumes and mounts, e.g. a CA certificate for PG_SSLROOTCERT / BITCOIN_RPC_CA_FILE:
#   extraVolumes:
#     - name: postgres-ca
#       secret: { secretName: stratum-pg-ca, items: [{ key: ca.crt, path: ca.crt }] }
#   extraVolumeMounts:
#     - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: true
  type: ClusterIP
  port: 8001
  
  ## Deprecated, instead simply do not provide a clusterIP value
  omitClusterIP: false
  # clusterIP: ""

  ## List of IP addresses at which the controller services are available
  ## Ref: https://kubernetes.io/docs/user-guide/services/#external-ips
  ##
  externalIPs: []

  loadBalancerIP: ""
  loadBalancerSourceRanges: []

  ## Set external traffic policy to: "Local" to preserve source IP on
  ## providers supporting it
  ## Ref: https://kubernetes.io/docs/tutorials/services/source-ip/#source-ip-for-services-with-typeloadbalancer
  externalTrafficPolicy: ""

  # Must be either "None" or "ClientIP" if set. Kubernetes will default to "None".
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
  sessionAffinity: ""

  healthCheckNodePort: 0

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Pod Security Context
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

# Container Security Context
containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {} 